<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tetris M</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: #000;
    overflow: hidden; font-family: monospace;
  }
  .viewport {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .stage {
    display: flex; align-items: center; gap: 26px;
    user-select: none; -webkit-user-select: none;
  }
  canvas#game {
    display: block;
    image-rendering: pixelated;
  }
  /* ---- 十字方向键 ---- */
  .dpad {
    display: grid;
    grid-template-columns: 62px 62px 62px;
    grid-template-rows: 62px 62px 62px;
    grid-template-areas:
      ". up ."
      "left mid right"
      ". down .";
  }
  .key {
    background: #fff; color: #000;
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; line-height: 1;
    box-shadow: 5px 5px 0 #555;
    touch-action: none;
  }
  .key:active { transform: translate(2px, 2px); box-shadow: 3px 3px 0 #555; }
  .key.up    { grid-area: up; }
  .key.down  { grid-area: down; }
  .key.left  { grid-area: left; }
  .key.right { grid-area: right; }
  .key.mid   { grid-area: mid; background: #ddd; box-shadow: inset 3px 3px 0 #999; cursor: default; }
  /* ---- A / B 圆形按钮 ---- */
  .ab { display: flex; flex-direction: column; gap: 22px; align-items: center; }
  .round {
    width: 74px; height: 74px; border-radius: 50%;
    background: #fff; color: #000; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; font-weight: bold; line-height: 1;
    box-shadow: 5px 5px 0 #555;
    touch-action: none;
  }
  .round:active { transform: translate(2px, 2px); box-shadow: 3px 3px 0 #555; }
</style>
</head>
<body>
<div class="viewport">
  <div class="stage" id="stage">

    <div class="dpad">
      <button class="key up"   id="bUp">▲</button>
      <button class="key left" id="bLeft">◀</button>
      <div class="key mid"></div>
      <button class="key right" id="bRight">▶</button>
      <button class="key down" id="bDown">▼</button>
    </div>

    <canvas id="game"></canvas>

    <div class="ab">
      <button class="round" id="bB">B</button>
      <button class="round" id="bA">A</button>
    </div>

  </div>
</div>

<script>
(function(){
  "use strict";

  /* ============ 常量 ============ */
  const COLS = 10, ROWS = 20, CELL = 30;
  const BOARD_W = COLS * CELL, BOARD_H = ROWS * CELL;   // 300 x 600
  const HUD_X = 322;                                      // 右侧信息区
  const W = 480, H = 600;                                 // 画布逻辑尺寸
  const DROP_MS = 800;                                    // 恒定下落速度（最简玩法）
  const REDSTONE = 8, TNT = 9;                            // 红石 / TNT 方块类型
  const COMMAND = 10;                                     // 命令方块类型（单格）

  const canvas = document.getElementById('game');
  const SCALE = 2;
  canvas.width = W * SCALE;
  canvas.height = H * SCALE;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(SCALE, SCALE);
  ctx.imageSmoothingEnabled = false;

  /* ============ 随机数 / 噪声 ============ */
  function mulberry32(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function makeValueNoise(seed, cell){
    const rnd = mulberry32(seed);
    const gx = Math.ceil(16 / cell) + 2, gy = Math.ceil(16 / cell) + 2;
    const vals = new Array(gx * gy);
    for (let i = 0; i < vals.length; i++) vals[i] = rnd();
    return function(x, y){
      const u = x / cell, v = y / cell;
      const x0 = Math.floor(u), y0 = Math.floor(v);
      let fx = u - x0, fy = v - y0;
      fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
      const a = vals[y0 * gx + x0],     b = vals[y0 * gx + x0 + 1];
      const c = vals[(y0 + 1) * gx + x0], d = vals[(y0 + 1) * gx + x0 + 1];
      return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
    };
  }
  function clamp(v){ return v < 0 ? 0 : (v > 255 ? 255 : v); }

  /* ============ MC 材质贴图生成（16x16，程序化） ============ */
  function makeTex(draw){
    const cv = document.createElement('canvas'); cv.width = 16; cv.height = 16;
    draw(cv.getContext('2d'));
    return cv;
  }
  function fillPixels(c, colorFn){
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++){
      const rgb = colorFn(x, y);
      c.fillStyle = 'rgb(' + (rgb[0]|0) + ',' + (rgb[1]|0) + ',' + (rgb[2]|0) + ')';
      c.fillRect(x, y, 1, 1);
    }
  }

  function texStone(){ // I
    const n = makeValueNoise(11, 4);
    return makeTex(c => fillPixels(c, (x,y) => {
      const g = Math.round(72 + n(x,y) * 45);
      return [g, g, g];
    }));
  }
  function texGrass(){ // O
    const n = makeValueNoise(41, 3);
    return makeTex(c => fillPixels(c, (x,y) => {
      const v = n(x,y);
      if (y < 4) return [Math.round(72+v*48), Math.round(125+v*50), Math.round(55+v*28)]; // 绿
      if (y === 4) return [58, 108, 44]; // 草地边缘
      return [Math.round(120+v*38), Math.round(85+v*30), Math.round(55+v*24)]; // 泥土
    }));
  }
  function texWood(){ // T
    const n = makeValueNoise(51, 3);
    return makeTex(c => fillPixels(c, (x,y) => {
      const v = n(x,y);
      let r = 158 + v*26, g = 120 + v*24, b = 72 + v*16;
      if (y % 4 === 0){ r -= 48; g -= 36; b -= 22; } // 木板横缝
      const band = Math.floor(y / 4);
      const joints = band % 2 === 0 ? [3,7,11,15] : [1,5,9,13];
      if (joints.indexOf(x) >= 0){ r -= 42; g -= 30; b -= 18; } // 竖向接缝
      if ((x*7 + y*13) % 23 === 0){ r -= 16; g -= 11; b -= 7; } // 木纹
      return [clamp(r), clamp(g), clamp(b)];
    }));
  }
  function texBrick(){ // S
    const n = makeValueNoise(61, 3);
    return makeTex(c => fillPixels(c, (x,y) => {
      if (y % 5 === 0) return [205, 196, 186]; // 灰缝
      const band = Math.floor(y / 5);
      const joints = band % 2 === 0 ? [3,7,11,15] : [1,5,9,13];
      if (joints.indexOf(x) >= 0) return [205, 196, 186];
      const v = n(x,y);
      return [Math.round(150+v*18), Math.round(74+v*14), Math.round(60+v*12)];
    }));
  }
  function texDiamond(){ // Z
    const n = makeValueNoise(71, 4);
    const ds = [[4,5],[11,4],[6,12],[12,12]];
    return makeTex(c => fillPixels(c, (x,y) => {
      for (let i = 0; i < ds.length; i++){
        const d = Math.abs(x - ds[i][0]) + Math.abs(y - ds[i][1]);
        if (d <= 2) return d <= 1 ? [96, 245, 235] : [150, 222, 214];
      }
      const g = Math.round(85 + n(x,y) * 48);
      return [g, g, g];
    }));
  }
  function texDirt(){ // J
    const n = makeValueNoise(31, 3);
    return makeTex(c => fillPixels(c, (x,y) => {
      const v = n(x,y);
      return [Math.round(120+v*38), Math.round(85+v*30), Math.round(55+v*24)];
    }));
  }
  function texGold(){ // L
    const n = makeValueNoise(81, 3);
    return makeTex(c => fillPixels(c, (x,y) => {
      const v = n(x,y);
      let r = 214 + v*40, g = 175 + v*40, b = 62 + v*24;
      if (x === 0 || y === 0 || x === 15 || y === 15){ r -= 26; g -= 20; b -= 10; }
      return [clamp(r), clamp(g), clamp(b)];
    }));
  }
  function texRedstone(){ // 红石
    const n = makeValueNoise(91, 3);
    return makeTex(c => fillPixels(c, (x,y) => {
      if ((x*13 + y*7) % 17 === 0) return [255, 82, 70];   // 亮红粉末颗粒
      if ((x*5 + y*11) % 29 === 0) return [225, 50, 42];
      const v = n(x,y);
      return [Math.round(150 + v*55), Math.round(28 + v*15), Math.round(28 + v*15)];
    }));
  }
  function texTNT(){ // TNT
    const n = makeValueNoise(101, 3);
    const mini = {
      'T': ["111","010","010","010","010"],
      'N': ["101","111","101","101","101"],
    };
    return makeTex(c => {
      fillPixels(c, (x,y) => {
        const v = n(x,y);
        return [Math.round(178 + v*42), Math.round(56 + v*20), Math.round(46 + v*15)]; // 红色
      });
      c.fillStyle = '#f2ede4';                                   // 白色横带
      for (let x = 0; x < 16; x++){ c.fillRect(x, 2, 1, 1); c.fillRect(x, 3, 1, 1); c.fillRect(x, 12, 1, 1); c.fillRect(x, 13, 1, 1); }
      const word = 'TNT'; let sx = 2, sy = 6;                    // 中间 TNT 字样
      for (let i = 0; i < word.length; i++){
        const g = mini[word[i]];
        for (let r = 0; r < 5; r++) for (let cc = 0; cc < 3; cc++){
          if (g[r][cc] === '1') c.fillRect(sx + cc, sy + r, 1, 1);
        }
        sx += 4;
      }
    });
  }
  function texCommand(){ // 命令方块
    const n = makeValueNoise(111, 4);
    return makeTex(c => fillPixels(c, (x,y) => {
      if ((x*3 + y*5) % 11 === 0) return [110, 82, 45];   // 深色点阵（代码纹）
      if ((x*7 + y*2) % 13 === 0) return [122, 96, 56];
      const v = n(x,y);
      return [Math.round(190 + v*35), Math.round(150 + v*30), Math.round(92 + v*25)];
    }));
  }
  const TEX = [null, texStone(), texGrass(), texWood(), texBrick(), texDiamond(), texDirt(), texGold(), texRedstone(), texTNT(), texCommand()];

  /* ============ 方块形状（10 种，4 个旋转态） ============ */
  const SHAPES = {
    1: [[[0,1],[1,1],[2,1],[3,1]], [[2,0],[2,1],[2,2],[2,3]], [[0,2],[1,2],[2,2],[3,2]], [[1,0],[1,1],[1,2],[1,3]]], // I
    2: [[[1,0],[2,0],[1,1],[2,1]], [[1,0],[2,0],[1,1],[2,1]], [[1,0],[2,0],[1,1],[2,1]], [[1,0],[2,0],[1,1],[2,1]]], // O
    3: [[[1,0],[0,1],[1,1],[2,1]], [[1,0],[1,1],[2,1],[1,2]], [[0,1],[1,1],[2,1],[1,2]], [[1,0],[0,1],[1,1],[1,2]]], // T
    4: [[[1,0],[2,0],[0,1],[1,1]], [[1,0],[1,1],[2,1],[2,2]], [[1,1],[2,1],[0,2],[1,2]], [[0,0],[0,1],[1,1],[1,2]]], // S
    5: [[[0,0],[1,0],[1,1],[2,1]], [[2,0],[1,1],[2,1],[1,2]], [[0,1],[1,1],[1,2],[2,2]], [[1,0],[0,1],[1,1],[0,2]]], // Z
    6: [[[0,0],[0,1],[1,1],[2,1]], [[1,0],[2,0],[1,1],[1,2]], [[0,1],[1,1],[2,1],[2,2]], [[1,0],[1,1],[0,2],[1,2]]], // J
    7: [[[2,0],[0,1],[1,1],[2,1]], [[1,0],[1,1],[1,2],[2,2]], [[0,1],[1,1],[2,1],[0,2]], [[0,0],[1,0],[1,1],[1,2]]], // L
    8: [[[1,0],[0,1],[1,1],[2,1]], [[1,0],[1,1],[2,1],[1,2]], [[0,1],[1,1],[2,1],[1,2]], [[1,0],[0,1],[1,1],[1,2]]], // 红石 (T形)
    9: [[[1,0],[2,0],[1,1],[2,1]], [[1,0],[2,0],[1,1],[2,1]], [[1,0],[2,0],[1,1],[2,1]], [[1,0],[2,0],[1,1],[2,1]]], // TNT (2x2)
    10: [[[0,0]], [[0,0]], [[0,0]], [[0,0]]], // 命令方块（单格）
  };

  /* ============ 像素字体（5x7） ============ */
  const FONT = {
    '0':["01110","10001","10011","10101","11001","10001","01110"],
    '1':["00100","01100","00100","00100","00100","00100","01110"],
    '2':["01110","10001","00001","00010","00100","01000","11111"],
    '3':["11111","00010","00100","00010","00001","10001","01110"],
    '4':["00010","00110","01010","10010","11111","00010","00010"],
    '5':["11111","10000","11110","00001","00001","10001","01110"],
    '6':["00110","01000","10000","11110","10001","10001","01110"],
    '7':["11111","00001","00010","00100","01000","01000","01000"],
    '8':["01110","10001","10001","01110","10001","10001","01110"],
    '9':["01110","10001","10001","01111","00001","00010","01100"],
    'A':["01110","10001","10001","11111","10001","10001","10001"],
    'B':["11110","10001","10001","11110","10001","10001","11110"],
    'C':["01110","10001","10000","10000","10000","10001","01110"],
    'E':["11111","10000","10000","11110","10000","10000","11111"],
    'G':["01110","10001","10000","10111","10001","10001","01111"],
    'I':["00100","00100","00100","00100","00100","00100","00100"],
    'M':["10001","11011","10101","10101","10001","10001","10001"],
    'N':["10001","11001","10101","10011","10001","10001","10001"],
    'O':["01110","10001","10001","10001","10001","10001","01110"],
    'P':["11110","10001","10001","11110","10000","10000","10000"],
    'R':["11110","10001","10001","11110","10100","10010","10001"],
    'S':["01111","10000","10000","01110","00001","00001","11110"],
    'T':["11111","00100","00100","00100","00100","00100","00100"],
    'V':["10001","10001","10001","10001","10001","01010","00100"],
    'X':["10001","10001","01010","00100","01010","10001","10001"],
    ' ':[ "00000","00000","00000","00000","00000","00000","00000"],
  };
  function drawText(text, x, y, scale, gap){
    gap = gap || 1;
    let cx = x;
    for (let i = 0; i < text.length; i++){
      const g = FONT[text[i]] || FONT[' '];
      for (let r = 0; r < 7; r++) for (let c = 0; c < 5; c++){
        if (g[r][c] === '1') ctx.fillRect(cx + c*scale, y + r*scale, scale, scale);
      }
      cx += 5*scale + gap;
    }
  }
  function textWidth(text, scale, gap){ gap = gap || 1; return text.length*(5*scale+gap) - gap; }

  /* ============ 游戏状态 ============ */
  let board, score, nextType, p, state, dropAcc;

  function newBoard(){ const b = []; for (let y = 0; y < ROWS; y++) b.push(new Array(COLS).fill(0)); return b; }
  function randType(){ return 1 + Math.floor(Math.random() * 10); }
  function randNormalType(){ return 1 + Math.floor(Math.random() * 9); }

  /* ============ 音乐 / 音效 ============ */
  let musicLoopStarted = false, musicTimer = null, audioCtx = null, musicBuffers = [];

  function ensureAudio(){
    if (!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playPlaceSound(){ // 合成"放置石头"音效：低频"咚" + 短噪声"啪"
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(160, t);
    osc.frequency.exponentialRampToValueAtTime(70, t + 0.09);
    g.gain.setValueAtTime(0.5, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.13);
    const dur = 0.05;
    const buf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * dur), audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random()*2 - 1) * Math.pow(1 - i/data.length, 2);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.22, t);
    ng.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(ng); ng.connect(audioCtx.destination);
    src.start(t);
  }

  /* ---- 程序化合成的原创氛围背景音乐（3 首，免费无版权） ---- */
  function midiToFreq(m){ return 440 * Math.pow(2, (m - 69) / 12); }
  const AMBIENT_VARIANTS = [
    { chords: [[45,57,60,64],[41,57,60,65],[48,55,60,64],[43,55,59,62],[45,57,60,64],[41,57,60,65],[48,55,60,64],[43,55,59,62]], chordDur: 5, density: 5, octShift: 0, noteDur: 3.0, noteAmp: 0.07, padAmp: 0.035, bright: 0.35, seed: 1234 },
    { chords: [[48,55,60,64],[45,57,60,64],[41,57,60,65],[43,55,59,62],[48,55,60,64],[43,55,59,62],[41,57,60,65],[48,55,60,64]], chordDur: 6, density: 3, octShift: 0, noteDur: 4.0, noteAmp: 0.06, padAmp: 0.04, bright: 0.2, seed: 5678 },
    { chords: [[45,57,60,64],[48,55,60,64],[41,57,60,65],[45,57,60,64],[43,55,59,62],[45,57,60,64]], chordDur: 8, density: 2, octShift: -12, noteDur: 5.0, noteAmp: 0.05, padAmp: 0.045, bright: 0.15, seed: 9012 },
  ];
  function addTone(L, R, start, dur, freq, amp, pan, bright, sr){
    const end = Math.min(L.length, Math.floor(start + dur));
    for (let i = Math.floor(start); i < end; i++){
      const t = (i - start) / sr, d = dur / sr;
      const env = Math.min(1, t/0.4) * Math.pow(1 - Math.min(1, t/d), 2);
      const w = 2 * Math.PI * freq * t;
      const s = Math.sin(w) + bright * Math.sin(w*2) + bright * 0.4 * Math.sin(w*3);
      const v = s * env * amp;
      L[i] += v * (1 - pan*0.5); R[i] += v * (0.5 + pan*0.5);
    }
  }
  function addPad(L, R, start, dur, freq, amp, sr){
    const end = Math.min(L.length, Math.floor(start + dur));
    for (let i = Math.floor(start); i < end; i++){
      const t = (i - start) / sr, d = dur / sr;
      const env = Math.min(1, t/1.5) * Math.min(1, (d - t)/1.5);
      const w = 2 * Math.PI * freq * t;
      const s = Math.sin(w) + 0.3 * Math.sin(w*2);
      const v = s * env * amp;
      L[i] += v; R[i] += v;
    }
  }
  function composeAmbient(variant){
    const sr = audioCtx.sampleRate;
    const totalDur = variant.chords.length * variant.chordDur;
    const len = Math.floor(sr * totalDur);
    const buf = audioCtx.createBuffer(2, len, sr);
    const L = buf.getChannelData(0), R = buf.getChannelData(1);
    const rnd = mulberry32(variant.seed);
    for (let c = 0; c < variant.chords.length; c++){
      addPad(L, R, c*variant.chordDur*sr, variant.chordDur*sr, midiToFreq(variant.chords[c][0] - 12), variant.padAmp, sr);
    }
    for (let c = 0; c < variant.chords.length; c++){
      const base = c * variant.chordDur, notes = variant.chords[c];
      for (let i = 0; i < variant.density; i++){
        const midi = notes[Math.floor(rnd() * notes.length)] + variant.octShift;
        const start = (base + rnd() * variant.chordDur * 0.85) * sr;
        const dur = (1.2 + rnd() * variant.noteDur) * sr;
        const amp = variant.noteAmp * (0.7 + rnd() * 0.6);
        const pan = 0.1 + rnd() * 0.8;
        addTone(L, R, start, dur, midiToFreq(midi), amp, pan, variant.bright, sr);
      }
    }
    let peak = 0;
    for (let i = 0; i < len; i++) peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i]));
    if (peak > 0.85){ const k = 0.85 / peak; for (let i = 0; i < len; i++){ L[i] *= k; R[i] *= k; } }
    return buf;
  }
  function ensureMusicBuffer(idx){
    if (!musicBuffers[idx]) musicBuffers[idx] = composeAmbient(AMBIENT_VARIANTS[idx]);
    return musicBuffers[idx];
  }

  function startMusicLoop(){
    if (musicLoopStarted) return;
    musicLoopStarted = true;
    scheduleNextMusic(10000);   // 开始游戏后 10 秒播第一首
  }
  function scheduleNextMusic(delay){
    clearTimeout(musicTimer);
    musicTimer = setTimeout(playRandomMusic, delay);
  }
  function playRandomMusic(){
    if (!audioCtx) return;
    const idx = Math.floor(Math.random() * AMBIENT_VARIANTS.length);
    const src = audioCtx.createBufferSource();
    src.buffer = ensureMusicBuffer(idx);
    src.connect(audioCtx.destination);
    src.addEventListener('ended', function(){ scheduleNextMusic(10000); }); // 播完停 10 秒再随机下一首
    src.start();
  }

  function collides(type, rot, px, py){
    const cells = SHAPES[type][rot];
    for (let i = 0; i < cells.length; i++){
      const x = px + cells[i][0], y = py + cells[i][1];
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y >= 0 && board[y][x] !== 0) return true;
    }
    return false;
  }

  function moveDown(){
    if (!collides(p.type, p.rot, p.x, p.y + 1)){ p.y++; return true; }
    return false;
  }
  function move(dx){
    if (state === 'playing' && !collides(p.type, p.rot, p.x + dx, p.y)) p.x += dx;
  }
  function rotate(){
    if (state !== 'playing') return;
    const nr = (p.rot + 1) % 4;
    if (!collides(p.type, nr, p.x, p.y)){ p.rot = nr; return; }
    const kicks = [-1, 1, -2, 2];
    for (let i = 0; i < kicks.length; i++){
      if (!collides(p.type, nr, p.x + kicks[i], p.y)){ p.rot = nr; p.x += kicks[i]; return; }
    }
  }
  function hardDrop(){
    if (state !== 'playing') return;
    while (moveDown()){}
    lockPiece();
  }

  function lockPiece(){
    const cells = SHAPES[p.type][p.rot];
    for (let i = 0; i < cells.length; i++){
      const x = p.x + cells[i][0], y = p.y + cells[i][1];
      if (y >= 0) board[y][x] = p.type;
    }
    playPlaceSound();      // 方块安放音效
    resolveExplosions();   // 红石点燃 TNT → 连锁爆炸 → 重力塌陷
    clearLines();
    spawnPiece();
    dropAcc = 0;
  }
  function hasRedstoneNeighbor(x, y){
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    for (let i = 0; i < dirs.length; i++){
      const nx = x + dirs[i][0], ny = y + dirs[i][1];
      if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && board[ny][nx] === REDSTONE) return true;
    }
    return false;
  }
  function applyGravity(){
    for (let x = 0; x < COLS; x++){
      let w = ROWS - 1;
      for (let y = ROWS - 1; y >= 0; y--){
        if (board[y][x] !== 0){
          if (w !== y){ board[w][x] = board[y][x]; board[y][x] = 0; }
          w--;
        }
      }
    }
  }
  function resolveExplosions(){
    // 1. 找出所有四方向接触红石的 TNT 格子
    const ignited = [];
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++){
      if (board[y][x] === TNT && hasRedstoneNeighbor(x, y)) ignited.push([x, y]);
    }
    if (ignited.length === 0) return;
    // 2. BFS 连锁爆炸：每个点燃的 TNT 清除自身 3x3，范围内其它 TNT 连锁
    const q = ignited.slice();
    const seen = {};
    while (q.length){
      const cur = q.shift();
      const cx = cur[0], cy = cur[1];
      const key = cy * COLS + cx;
      if (seen[key]) continue;
      seen[key] = true;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++){
        const nx = cx + dx, ny = cy + dy;
        if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
        if (board[ny][nx] === 0) continue;
        if (board[ny][nx] === TNT && !seen[ny * COLS + nx]) q.push([nx, ny]);
        board[ny][nx] = 0;
      }
    }
    // 3. 重力塌陷
    applyGravity();
  }
  function clearLines(){
    let cleared = 0;
    let cmdTriggered = false;
    for (let y = ROWS - 1; y >= 0; ){
      let full = true;
      for (let x = 0; x < COLS; x++) if (board[y][x] === 0){ full = false; break; }
      if (full){
        if (board[y].indexOf(COMMAND) >= 0) cmdTriggered = true;
        board.splice(y, 1);
        board.unshift(new Array(COLS).fill(0));
        cleared++;
      } else y--;
    }
    if (cleared) score += [0, 100, 300, 500, 800][cleared];
    if (cmdTriggered) randomizeAllBlocks();
  }
  function randomizeAllBlocks(){
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++){
      if (board[y][x] !== 0) board[y][x] = randNormalType();
    }
  }
  function spawnPiece(){
    p = { type: nextType, rot: 0, x: 3, y: -1 };
    nextType = randType();
    if (collides(p.type, p.rot, p.x, p.y)) state = 'over';
  }

  function startOrRestart(){
    if (state !== 'playing'){
      ensureAudio();
      startMusicLoop();
      board = newBoard();
      score = 0;
      nextType = randType();
      state = 'playing';
      spawnPiece();
      dropAcc = 0;
    }
  }

  /* ============ 渲染 ============ */
  function drawBoard(){
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, BOARD_W, BOARD_H);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, BOARD_W - 2, BOARD_H - 2);
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++){
      const t = board[y][x];
      if (t) ctx.drawImage(TEX[t], x*CELL, y*CELL, CELL, CELL);
    }
    if (state === 'playing' && p){
      const cells = SHAPES[p.type][p.rot];
      for (let i = 0; i < cells.length; i++){
        const x = p.x + cells[i][0], y = p.y + cells[i][1];
        if (y >= 0) ctx.drawImage(TEX[p.type], x*CELL, y*CELL, CELL, CELL);
      }
    }
  }
  function drawNext(){
    const cells = SHAPES[nextType][0];
    let minx = 9, maxx = -9, miny = 9, maxy = -9;
    for (let i = 0; i < cells.length; i++){
      minx = Math.min(minx, cells[i][0]); maxx = Math.max(maxx, cells[i][0]);
      miny = Math.min(miny, cells[i][1]); maxy = Math.max(maxy, cells[i][1]);
    }
    const w = maxx - minx + 1, h = maxy - miny + 1;
    const px = HUD_X + Math.floor((72 - w*16) / 2);
    const py = 172 + Math.floor((72 - h*16) / 2);
    for (let i = 0; i < cells.length; i++){
      ctx.drawImage(TEX[nextType], px + (cells[i][0]-minx)*16, py + (cells[i][1]-miny)*16, 16, 16);
    }
  }
  function drawHUD(){
    ctx.fillStyle = '#fff';
    drawText('SCORE', HUD_X, 36, 2);
    drawText(String(score).padStart(8, '0'), HUD_X, 58, 3);
    drawText('NEXT', HUD_X, 148, 2);
    drawNext();
  }
  function drawReady(){
    ctx.fillStyle = '#fff';
    const t1 = 'TETRIS M', t2 = 'TAP / ENTER';
    drawText(t1, (BOARD_W - textWidth(t1, 4)) / 2, 250, 4);
    drawText(t2, (BOARD_W - textWidth(t2, 2)) / 2, 320, 2);
  }
  function drawOver(){
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    ctx.fillRect(0, 0, BOARD_W, BOARD_H);
    ctx.fillStyle = '#fff';
    const a = 'GAME OVER', b = 'SCORE', c = String(score).padStart(8, '0'), d = 'TAP TO RESTART';
    drawText(a, (BOARD_W - textWidth(a, 3)) / 2, 220, 3);
    drawText(b, (BOARD_W - textWidth(b, 2)) / 2, 268, 2);
    drawText(c, (BOARD_W - textWidth(c, 3)) / 2, 292, 3);
    drawText(d, (BOARD_W - textWidth(d, 2)) / 2, 350, 2);
  }
  function draw(){
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    drawBoard();
    drawHUD();
    if (state === 'ready') drawReady();
    if (state === 'over') drawOver();
  }

  /* ============ 主循环 ============ */
  let last = performance.now();
  function loop(now){
    const dt = now - last; last = now;
    if (state === 'playing'){
      dropAcc += dt;
      while (dropAcc >= DROP_MS){
        dropAcc -= DROP_MS;
        if (!moveDown()){ lockPiece(); break; }
      }
    }
    draw();
    requestAnimationFrame(loop);
  }

  /* ============ 键盘 ============ */
  window.addEventListener('keydown', function(e){
    const k = e.key;
    if (k === 'ArrowLeft'  || k === 'a' || k === 'A'){ e.preventDefault(); move(-1); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D'){ e.preventDefault(); move(1); }
    else if (k === 'ArrowDown'  || k === 's' || k === 'S'){ e.preventDefault(); if (state==='playing' && !moveDown()) lockPiece(); }
    else if (k === 'ArrowUp'    || k === 'w' || k === 'W'){ e.preventDefault(); if (!e.repeat) rotate(); }
    else if (e.code === 'ShiftRight'){ e.preventDefault(); if (!e.repeat) rotate(); }  // A键：右Shift → 旋转
    else if (k === ' '){ e.preventDefault(); if (!e.repeat) hardDrop(); }
    else if (k === 'Enter'){                                                    // B键：Enter → 硬降
      e.preventDefault();
      if (state === 'playing'){ if (!e.repeat) hardDrop(); }
      else startOrRestart();
    }
  });

  /* ============ 触屏按钮 ============ */
  function bindButton(el, onDown, repeat){
    let iv = null;
    const start = function(e){
      e.preventDefault();
      if (e.pointerId != null && el.setPointerCapture) el.setPointerCapture(e.pointerId);
      onDown();
      if (repeat){ iv = setInterval(onDown, 130); }
    };
    const stop = function(e){
      if (iv){ clearInterval(iv); iv = null; }
    };
    el.addEventListener('pointerdown', start);
    el.addEventListener('pointerup', stop);
    el.addEventListener('pointerleave', stop);
    el.addEventListener('pointercancel', stop);
  }
  bindButton(document.getElementById('bLeft'),  function(){ move(-1); }, true);
  bindButton(document.getElementById('bRight'), function(){ move(1);  }, true);
  bindButton(document.getElementById('bDown'),  function(){ if (state==='playing' && !moveDown()) lockPiece(); }, true);
  bindButton(document.getElementById('bUp'),    function(){ rotate(); }, false);
  bindButton(document.getElementById('bA'),     function(){ rotate(); }, false);
  bindButton(document.getElementById('bB'),     function(){ hardDrop(); }, false);

  canvas.addEventListener('pointerdown', function(){ startOrRestart(); });

  /* ============ 自适应缩放 ============ */
  const stage = document.getElementById('stage');
  function fit(){
    const s = Math.min(window.innerWidth / stage.offsetWidth, window.innerHeight / stage.offsetHeight, 1) * 0.96;
    stage.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);

  /* ============ 初始化 ============ */
  board = newBoard();
  score = 0;
  nextType = randType();
  state = 'ready';
  dropAcc = 0;
  fit();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
